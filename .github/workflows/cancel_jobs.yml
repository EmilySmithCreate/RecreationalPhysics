# Cancel Batch jobs by the commit that submitted them, from GitHub, so that no laptop credentials are needed.
#
# Every job run_queue submits is named "<config>-<first 7 characters of the commit>". A cancel file under
# cloud/cancel/ holds one such commit prefix per line (blank lines and # comments ignored). Pushing a commit
# that adds or changes a cancel file terminates every job whose name ends in "-<prefix>" and has not finished
# (SUBMITTED, PENDING, RUNNABLE, STARTING, RUNNING). Finished jobs are left alone. A job stopped while running
# saves its scratch to partial/, which the bucket expires; no finished result is touched.
#
# Why push-triggered, like run_queue: a push runs the workflow from the branch it is on, so it works from any
# branch and from a phone (edit a file in the GitHub app or on github.com). It can also be dispatched by hand
# from the Actions tab once this file is on the default branch.
#
# First use, 2026-09-26: the merge of PR #38 into main resubmitted all twelve queue files (195 configs) under
# commit 3d50c19, every one of which already had a finished result in the bucket.
name: cancel_jobs

on:
  workflow_dispatch:
    inputs:
      prefix:
        description: "commit prefix (7 characters) of the submission to cancel"
        required: true
  push:
    branches: ["**"]
    paths:
      - "cloud/cancel/**"

permissions:
  id-token: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_REGION: us-east-1

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: which commit prefixes to cancel
        id: prefixes
        run: |
          if [ -n "${{ inputs.prefix }}" ]; then
            P="${{ inputs.prefix }}"
          else
            if git rev-parse --verify --quiet "${{ github.event.before }}" >/dev/null && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
              FILES=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- cloud/cancel)
            else
              FILES=$(git show --name-only --pretty="" "${{ github.sha }}" -- cloud/cancel)
            fi
            P=$(for f in $FILES; do [ -f "$f" ] && cat "$f"; done | grep -v '^\s*#' | grep -v '^\s*$' | sort -u)
          fi
          # A prefix must look like a commit prefix, so a stray word cannot match job names it was not meant to.
          for p in $P; do echo "$p" | grep -Eq '^[0-9a-f]{7}$' || { echo "not a 7-character commit prefix: $p"; exit 1; }; done
          test -n "$P"
          echo "prefixes<<EOF" >> "$GITHUB_OUTPUT"; echo "$P" >> "$GITHUB_OUTPUT"; echo "EOF" >> "$GITHUB_OUTPUT"
          echo "cancelling jobs from: $P"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ci_cd
          aws-region: us-east-1
          role-duration-seconds: 1800

      - name: terminate every unfinished job from those commits
        run: |
          echo "### cancel_jobs" >> "$GITHUB_STEP_SUMMARY"
          TOTAL=0
          for P in ${{ steps.prefixes.outputs.prefixes }}; do
            for S in SUBMITTED PENDING RUNNABLE STARTING RUNNING; do
              # No --max-items: the CLI follows every page, so a submission of hundreds is listed in full.
              aws batch list-jobs --job-queue recphys --job-status $S \
                --query "jobSummaryList[].[jobId, jobName]" --output text \
                | awk -v p="-$P" 'length($2) > length(p) && substr($2, length($2) - length(p) + 1) == p' \
                > jobs.txt || true
              while read -r ID NAME; do
                aws batch terminate-job --job-id "$ID" --reason "duplicate submission from commit $P, cancelled by cancel_jobs" < /dev/null > /dev/null
                echo "terminated $NAME ($S) $ID"
                echo "- $NAME ($S)" >> "$GITHUB_STEP_SUMMARY"
                TOTAL=$((TOTAL + 1))
              done < jobs.txt
            done
          done
          echo "terminated $TOTAL jobs"
          echo "**$TOTAL jobs terminated.**" >> "$GITHUB_STEP_SUMMARY"
